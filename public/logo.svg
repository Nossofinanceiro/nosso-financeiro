<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 150" width="100%" height="100%">
  <defs>
    <!-- Use userSpaceOnUse to prevent bounding box issues on zero-width/height lines -->
    <linearGradient id="gradN" x1="0" y1="120" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#FF77FF" />
    </linearGradient>
    <linearGradient id="gradF" x1="0" y1="120" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#B266FF" />
    </linearGradient>
    <linearGradient id="gradDiag" x1="0" y1="0" x2="150" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF77FF" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    
    <filter id="overlapShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="0" stdDeviation="2.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(40, 15) skewX(-12)" filter="url(#mainShadow)">
    
    <!-- Right Leg & F Bars (Purple) -->
    <g stroke-linecap="round">
      <line x1="100" y1="30" x2="100" y2="90" stroke="url(#gradF)" stroke-width="32" />
      <line x1="100" y1="30" x2="160" y2="30" stroke="url(#gradF)" stroke-width="32" />
      <line x1="100" y1="70" x2="145" y2="70" stroke="url(#gradF)" stroke-width="26" />
    </g>

    <!-- Diagonal (Pink to Purple) -->
    <line x1="35" y1="30" x2="100" y2="90" stroke="url(#gradDiag)" stroke-width="32" stroke-linecap="round" />

    <!-- Left Leg (Pink) with overlap shadow -->
    <line x1="35" y1="30" x2="35" y2="90" stroke="url(#gradN)" stroke-width="32" stroke-linecap="round" filter="url(#overlapShadow)" />

  </g>

  <!-- Text Typography -->
  <!-- Made text larger and positioned properly to match the bolder icon -->
  <text x="240" y="70" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="62" fill="#FFFFFF" letter-spacing="-1.5">nosso</text>
  <text x="240" y="120" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="62" fill="#A855F7" letter-spacing="-1.5">financeiro</text>
</svg>
